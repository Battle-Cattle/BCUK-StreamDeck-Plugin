# Dependabot version updates. Options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Minor and patch bumps arrive as one PR, so CodeRabbit's hourly review limit isn't spent on each.
      # An update joins the first group it matches, so this catch-all stays last.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stream Deck runs the plugin on Node 24 (see CLAUDE.md "Node/npm version"). @types/node stays
      # on 24 to match the runtime: 25+ describe APIs that Node 24 doesn't have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
