# Dependabot version updates. Options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps arrive as one PR, so CodeRabbit's hourly review limit isn't spent on each.
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # Stream Deck runs the plugin on Node 20 (see CLAUDE.md "Node/npm version"). These follow
      # Node 20's types/config, and eslint-plugin-jsdoc 63+ drops Node 20, so their majors are
      # bumped by hand when Stream Deck's Node version moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tsconfig/node20"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-jsdoc"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
