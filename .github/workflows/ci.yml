name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A new push to a pull request cancels that PR's run still in progress. A push to main gets a
    # group of its own commit, so no merged commit's check is cancelled or skipped.
    concurrency:
      group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # The coverage job below publishes this to Qlty.
      - name: Keep lcov coverage for the Qlty upload
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1
      - name: Validate the plugin package
        run: npx streamdeck pack com.expiredminotaur.bcuk.sdPlugin --dry-run --no-update-check
      # The release job packs exactly this build instead of rebuilding.
      - name: Keep the build for the release job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-bin
          path: com.expiredminotaur.bcuk.sdPlugin/bin
          if-no-files-found: error
          retention-days: 1

  # Publishes coverage in a job of its own, so only this job can mint the OIDC token qlty-action
  # trades for a Qlty upload; the install, build and test steps in check never see it. GitHub gives
  # fork and Dependabot pull requests no OIDC token, and qlty-action fails the job when it can't
  # get one, so those runs skip the upload.
  # It also waits for its test job to pass: a failed one leaves no report to upload.
  coverage:
    needs: check
    if: >-
      needs.check.result == 'success' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Qlty checks the report's source paths against the checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: coverage
      - name: Publish coverage to Qlty
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage/lcov.info

  # Publishes the packed plugin as a GitHub Release whenever main carries a manifest version
  # that hasn't been released yet. The bot's web panel links to the latest release's asset, so
  # bumping "Version" in manifest.json (and "version" in package.json to match) and merging is
  # all a release takes.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: Read the manifest version
        id: version
        run: |
          version=$(node -p "require('./com.expiredminotaur.bcuk.sdPlugin/manifest.json').Version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; nothing to do."
            exit 0
          fi
          # Only "no such release" means publish; any other lookup failure (API, auth) stops here.
          if ! grep -qi 'release not found' <<<"$out"; then
            echo "::error::Could not check for release $TAG: $out"
            exit 1
          fi
          # gh release create reuses an existing tag instead of tagging --target, so a tag pushed
          # by hand must already point at this commit or the release would ship the wrong code.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$TAG" <<<"$refs"; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists at $tag_sha, not $GITHUB_SHA. Delete the tag or bump Version in manifest.json."
              exit 1
            fi
          fi
          echo "released=false" >> "$GITHUB_OUTPUT"
      # npm ci only for the Stream Deck CLI that packs the plugin; the build itself comes from check.
      - if: steps.existing.outputs.released == 'false'
        run: npm ci
      - name: Use the build check made
        if: steps.existing.outputs.released == 'false'
        uses: actions/download-artifact@v8
        with:
          name: plugin-bin
          path: com.expiredminotaur.bcuk.sdPlugin/bin
      - name: Pack the plugin
        if: steps.existing.outputs.released == 'false'
        run: npx streamdeck pack com.expiredminotaur.bcuk.sdPlugin --force --no-update-check -o dist
      - name: Publish the release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/com.expiredminotaur.bcuk.streamDeckPlugin \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BCUK Bot Stream Deck plugin $TAG" \
            --generate-notes \
            --latest
