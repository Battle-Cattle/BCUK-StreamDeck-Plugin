name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate the plugin package
        run: npx streamdeck pack com.expiredminotaur.bcuk.sdPlugin --dry-run --no-update-check

  # Publishes the packed plugin as a GitHub Release whenever main carries a manifest version
  # that hasn't been released yet. The bot's web panel links to the latest release's asset, so
  # bumping "Version" in manifest.json and merging is all a release takes.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Read the manifest version
        id: version
        run: |
          version=$(node -p "require('./com.expiredminotaur.bcuk.sdPlugin/manifest.json').Version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} is already released; nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.released == 'false'
        run: npm ci
      - if: steps.existing.outputs.released == 'false'
        run: npm run build
      - name: Pack the plugin
        if: steps.existing.outputs.released == 'false'
        run: npx streamdeck pack com.expiredminotaur.bcuk.sdPlugin --force --no-update-check -o dist
      - name: Publish the release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/com.expiredminotaur.bcuk.streamDeckPlugin \
            --target "$GITHUB_SHA" \
            --title "BCUK Bot Stream Deck plugin ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest
