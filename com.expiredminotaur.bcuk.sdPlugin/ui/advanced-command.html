<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Advanced Command</title>
	<link rel="stylesheet" href="pi-common.css" />
</head>
<body>

<div class="row">
	<label for="serverUrl">Server URL</label>
	<input type="text" id="serverUrl" placeholder="https://bot.example.com" autocomplete="off" spellcheck="false" />
</div>
<div id="urlWarning"></div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="command">Command</label>
	<select id="command">
		<option value="">— select a command —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Commands</button>
</div>
<div id="status"></div>

<script src="pi-common.js"></script>
<script>
	/* global selectSaved, setButtonSettings, setupCatalogPage */
	// Shared by Trigger Command and Toggle Command. Per-button settings: just the command's id.
	// The command list (your own advanced commands, from the bot's /advanced-commands page)
	// comes from the plugin.
	const commandSelect = document.getElementById("command");
	let commandId = "";

	const page = setupCatalogPage({
		selectId: "command",
		placeholder: "— select a command —",
		loadedEvent: "commandsLoaded",
		errorEvent: "commandsError",
		listKey: "commands",
		refreshEvent: "refreshCommands",
		noun: "commands",
		render: renderCommands,
		onLoaded: () => selectSaved(commandSelect, commandId, "Saved command", true),
	});

	/**
	 * Shows the button's saved command (pi-common.js calls this when its settings arrive).
	 * @param {object} s The button's settings.
	 */
	function onButtonSettings(s) {
		commandId = s.commandId || "";
		selectSaved(commandSelect, commandId, "Saved command", page.isLoaded());
	}

	/**
	 * Lists the streamer's advanced commands with their trigger, marking disabled ones.
	 * @param {HTMLSelectElement} sel The emptied dropdown.
	 * @param {Array<{id: number, name: string, trigger?: string, isEnabled: boolean}>} commands The commands from the plugin.
	 */
	function renderCommands(sel, commands) {
		for (const c of commands) {
			const opt = document.createElement("option");
			opt.value = String(c.id);
			const trigger = c.trigger ? ` (${c.trigger})` : "";
			opt.textContent = `${c.name}${trigger}${c.isEnabled ? "" : " — disabled"}`;
			sel.appendChild(opt);
		}
	}

	commandSelect.addEventListener("change", () => {
		commandId = commandSelect.value;
		setButtonSettings({ commandId });
	});
</script>

</body>
</html>
