<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Join Voice</title>
	<link rel="stylesheet" href="pi-common.css" />
</head>
<body>

<div class="row">
	<label for="serverUrl">Server URL</label>
	<input type="text" id="serverUrl" placeholder="https://bot.example.com" autocomplete="off" spellcheck="false" />
</div>
<div id="urlWarning"></div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="channel">Channel</label>
	<select id="channel">
		<option value="">— select a channel —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Channels</button>
</div>
<div id="status"></div>

<script src="pi-common.js"></script>
<script>
	/* global selectSaved, setButtonSettings, setupCatalogPage */
	// Per-button settings: the chosen channel and its server. The channel list comes from the plugin.
	const channelSelect = document.getElementById("channel");
	let selected = { channelId: "", guildId: "" };
	let channels = [];

	const page = setupCatalogPage({
		selectId: "channel",
		placeholder: "— select a channel —",
		loadedEvent: "channelsLoaded",
		errorEvent: "channelsError",
		listKey: "channels",
		refreshEvent: "refreshChannels",
		noun: "channels",
		render: renderChannels,
		onLoaded: () => selectSaved(channelSelect, selected.channelId, "Saved channel", true),
	});

	/**
	 * Shows the button's saved channel (pi-common.js calls this when its settings arrive).
	 * @param {object} s The button's settings.
	 */
	function onButtonSettings(s) {
		selected = { channelId: s.channelId || "", guildId: s.guildId || "" };
		selectSaved(channelSelect, selected.channelId, "Saved channel", page.isLoaded());
	}

	/**
	 * Lists channels, grouped by server when the key spans more than one.
	 * @param {HTMLSelectElement} sel The emptied dropdown.
	 * @param {Array<{id: string, name: string, guildId: string, guildName: string | null}>} list The channels from the plugin.
	 */
	function renderChannels(sel, list) {
		channels = list;
		const guildIds = [...new Set(channels.map((c) => c.guildId))];
		for (const guildId of guildIds) {
			const inGuild = channels.filter((c) => c.guildId === guildId);
			let parent = sel;
			if (guildIds.length > 1) {
				parent = document.createElement("optgroup");
				parent.label = inGuild[0].guildName || `Server ${guildId}`;
				sel.appendChild(parent);
			}
			for (const c of inGuild) {
				const opt = document.createElement("option");
				opt.value = c.id;
				opt.textContent = c.name;
				parent.appendChild(opt);
			}
		}
	}

	channelSelect.addEventListener("change", () => {
		const channelId = channelSelect.value;
		const match = channels.find((c) => c.id === channelId);
		// Re-picking a "(not found)" saved channel keeps the server it was saved with.
		const guildId = match ? match.guildId : channelId === selected.channelId ? selected.guildId : "";
		selected = { channelId, guildId };
		setButtonSettings(selected);
	});
</script>

</body>
</html>
