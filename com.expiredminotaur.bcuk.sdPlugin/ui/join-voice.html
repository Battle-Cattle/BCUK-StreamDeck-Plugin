<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Join Voice</title>
	<link rel="stylesheet" href="pi-common.css" />
</head>
<body>

<div class="row">
	<label for="serverUrl">Server URL</label>
	<input type="text" id="serverUrl" placeholder="https://bot.example.com" autocomplete="off" spellcheck="false" />
</div>
<div id="urlWarning"></div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="channel">Channel</label>
	<select id="channel">
		<option value="">— select a channel —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Channels</button>
</div>
<div id="status"></div>

<script src="pi-common.js"></script>
<script>
	// Per-button settings: the chosen channel and its server. The channel list comes from the plugin.
	let selected = { channelId: "", guildId: "" };
	let channels = [];
	let listLoaded = false;

	function onButtonSettings(s) {
		selected = { channelId: s.channelId || "", guildId: s.guildId || "" };
		selectSaved(document.getElementById("channel"), selected.channelId, "Saved channel", listLoaded);
	}

	function onPluginMessage(payload) {
		if (payload.event === "channelsLoaded") {
			channels = payload.channels || [];
			populateDropdown();
			setStatus("Channels loaded.", true);
		} else if (payload.event === "channelsError") {
			setStatus(`Error: ${payload.error}`);
		}
		document.getElementById("refreshBtn").disabled = false;
	}

	// Lists channels grouped by server when the key spans more than one.
	function populateDropdown() {
		const sel = document.getElementById("channel");
		sel.innerHTML = '<option value="">— select a channel —</option>';
		const guildIds = [...new Set(channels.map((c) => c.guildId))];
		for (const guildId of guildIds) {
			const inGuild = channels.filter((c) => c.guildId === guildId);
			let parent = sel;
			if (guildIds.length > 1) {
				parent = document.createElement("optgroup");
				parent.label = inGuild[0].guildName || `Server ${guildId}`;
				sel.appendChild(parent);
			}
			for (const c of inGuild) {
				const opt = document.createElement("option");
				opt.value = c.id;
				opt.textContent = c.name;
				parent.appendChild(opt);
			}
		}
		listLoaded = true;
		selectSaved(sel, selected.channelId, "Saved channel", listLoaded);
	}

	document.getElementById("channel").addEventListener("change", () => {
		const channelId = document.getElementById("channel").value;
		const match = channels.find((c) => c.id === channelId);
		// Re-picking a "(not found)" saved channel keeps the server it was saved with.
		const guildId = match ? match.guildId : channelId === selected.channelId ? selected.guildId : "";
		selected = { channelId, guildId };
		setButtonSettings(selected);
	});

	document.getElementById("refreshBtn").addEventListener("click", () => {
		setStatus("Fetching channels…");
		document.getElementById("refreshBtn").disabled = true;
		const { serverUrl, apiKey } = saveGlobal();
		sendToPlugin({ event: "refreshChannels", serverUrl, apiKey });
	});
</script>

</body>
</html>
