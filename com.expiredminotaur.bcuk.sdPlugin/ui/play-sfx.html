<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Play SFX</title>
	<link rel="stylesheet" href="pi-common.css" />
</head>
<body>

<div class="row">
	<label for="serverUrl">Server URL</label>
	<input type="text" id="serverUrl" placeholder="https://bot.example.com" autocomplete="off" spellcheck="false" />
</div>
<div id="urlWarning"></div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="command">Command</label>
	<select id="command">
		<option value="">— select a command —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Commands</button>
</div>
<div id="status"></div>

<script src="pi-common.js"></script>
<script>
	/* global selectSaved, setButtonSettings, setupCatalogPage */
	// Per-button settings: just the command. The trigger list comes from the plugin.
	const commandSelect = document.getElementById("command");
	let command = "";

	const page = setupCatalogPage({
		selectId: "command",
		placeholder: "— select a command —",
		loadedEvent: "commandsLoaded",
		errorEvent: "commandsError",
		listKey: "triggers",
		refreshEvent: "refreshCommands",
		noun: "commands",
		render: renderTriggers,
		onLoaded: () => selectSaved(commandSelect, command, command, true),
	});

	/**
	 * Shows the button's saved command (pi-common.js calls this when its settings arrive).
	 * @param {object} s The button's settings.
	 */
	function onButtonSettings(s) {
		command = s.command || "";
		// If the list already arrived, apply the saved selection now.
		selectSaved(commandSelect, command, command, page.isLoaded());
	}

	/**
	 * Lists the bot's sound effect commands, prefixed with their category.
	 * @param {HTMLSelectElement} sel The emptied dropdown.
	 * @param {Array<{triggerCommand: string, categoryName?: string}>} triggers The commands from the plugin.
	 */
	function renderTriggers(sel, triggers) {
		for (const t of triggers) {
			const opt = document.createElement("option");
			opt.value = t.triggerCommand;
			opt.textContent = t.categoryName ? `[${t.categoryName}] ${t.triggerCommand}` : t.triggerCommand;
			sel.appendChild(opt);
		}
	}

	commandSelect.addEventListener("change", () => {
		command = commandSelect.value;
		setButtonSettings({ command });
	});
</script>

</body>
</html>
