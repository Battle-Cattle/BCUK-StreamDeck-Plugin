<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Play SFX</title>
	<style>
		:root {
			--bg: #2d2d2d;
			--surface: #3d3d3d;
			--border: #4a4a4a;
			--text: #e0e0e0;
			--label: #9e9e9e;
			--accent: #e97e10;
			--error: #e74c3c;
			--success: #27ae60;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			font-size: 13px;
			color: var(--text);
			background: var(--bg);
			padding: 12px;
		}

		.row {
			display: flex;
			align-items: center;
			margin-bottom: 8px;
			gap: 8px;
		}

		.row label {
			width: 72px;
			min-width: 72px;
			color: var(--label);
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}

		.row input,
		.row select {
			flex: 1;
			min-width: 0;
			background: var(--surface);
			border: 1px solid var(--border);
			color: var(--text);
			border-radius: 3px;
			padding: 4px 6px;
			font-size: 13px;
			outline: none;
		}

		.row input:focus,
		.row select:focus {
			border-color: var(--accent);
		}

		.row button {
			flex: 1;
			background: var(--surface);
			border: 1px solid var(--border);
			color: var(--text);
			border-radius: 3px;
			padding: 5px 8px;
			cursor: pointer;
			font-size: 13px;
		}

		.row button:hover { background: var(--accent); border-color: var(--accent); }
		.row button:disabled { opacity: 0.5; cursor: default; }

		#status {
			margin-top: 4px;
			font-size: 11px;
			min-height: 14px;
			color: var(--error);
		}

		#status.ok { color: var(--success); }
	</style>
</head>
<body>

<div class="row">
	<label for="host">Host</label>
	<input type="text" id="host" placeholder="localhost" />
</div>
<div class="row">
	<label for="port">Port</label>
	<input type="number" id="port" placeholder="3000" min="1" max="65535" />
</div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="command">Command</label>
	<select id="command">
		<option value="">— select a command —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Commands</button>
</div>
<div id="status"></div>

<script>
	let ws = null;
	let context = null;

	// Per-button settings (just the command; the trigger list comes from the plugin)
	let perButton = {};
	// Global settings (host, port, apiKey) — maintained locally so we always
	// send a complete object to setGlobalSettings (it replaces, not merges)
	let globals = { host: "localhost", port: 3000, apiKey: "" };

	// ── WebSocket connection ──────────────────────────────────────────────

	function connectElgatoStreamDeckSocket(port, uuid, registerEvent) {
		ws = new WebSocket(`ws://127.0.0.1:${port}`);

		ws.onopen = () => {
			context = uuid;
			ws.send(JSON.stringify({ event: registerEvent, uuid }));
			ws.send(JSON.stringify({ event: "getSettings", context: uuid }));
			ws.send(JSON.stringify({ event: "getGlobalSettings", context: uuid }));
		};

		ws.onmessage = (e) => {
			const data = JSON.parse(e.data);

			// Per-button settings — arrives automatically when PI opens
			if (data.event === "didReceiveSettings") {
				applyPerButtonSettings(data.payload.settings || {});
			}

			// Global settings — response to getGlobalSettings or after setGlobalSettings
			if (data.event === "didReceiveGlobalSettings") {
				applyGlobalSettings(data.payload.settings || {});
			}

			// Messages pushed from the plugin (commandsLoaded / commandsError)
			if (data.event === "sendToPropertyInspector") {
				handlePluginMsg(data.payload);
			}
		};
	}

	// ── Settings ──────────────────────────────────────────────────────────

	function applyGlobalSettings(s) {
		globals = { host: "localhost", port: 3000, apiKey: "", ...s };
		document.getElementById("host").value = globals.host;
		document.getElementById("port").value = globals.port;
		if (globals.apiKey) {
			document.getElementById("apiKey").value = globals.apiKey;
		}
	}

	function applyPerButtonSettings(s) {
		perButton = { command: s.command || "" };
		// If commandsLoaded already populated the dropdown before this event
		// arrived, apply the saved selection now.
		if (perButton.command) document.getElementById("command").value = perButton.command;
	}

	function handlePluginMsg(payload) {
		if (payload.event === "commandsLoaded") {
			populateDropdown(payload.triggers || [], perButton.command || "");
			setStatus("Commands loaded.", true);
			document.getElementById("refreshBtn").disabled = false;
			return;
		}

		if (payload.event === "commandsError") {
			setStatus(`Error: ${payload.error}`);
			document.getElementById("refreshBtn").disabled = false;
		}
	}

	// ── Persist helpers ───────────────────────────────────────────────────

	// Reads the current form values, merges into globals, and sends setGlobalSettings.
	// Called on change of host, port, or apiKey.
	function saveGlobal() {
		globals = {
			host: document.getElementById("host").value.trim() || "localhost",
			port: parseInt(document.getElementById("port").value, 10) || 3000,
			apiKey: document.getElementById("apiKey").value.trim(),
		};
		ws.send(JSON.stringify({ event: "setGlobalSettings", context, payload: globals }));
	}

	// Per-button: saves the command only
	function saveCommand() {
		perButton = { command: document.getElementById("command").value };
		ws.send(JSON.stringify({ event: "setSettings", context, payload: perButton }));
	}

	function sendToPlugin(payload) {
		ws.send(JSON.stringify({ event: "sendToPlugin", context, payload }));
	}

	// ── Dropdown ──────────────────────────────────────────────────────────

	function populateDropdown(triggers, selectedCommand) {
		const sel = document.getElementById("command");
		sel.innerHTML = '<option value="">— select a command —</option>';

		for (const t of triggers) {
			const opt = document.createElement("option");
			opt.value = t.triggerCommand;

			let label = t.triggerCommand;
			if (t.categoryName) label = `[${t.categoryName}] ${label}`;

			opt.textContent = label;
			sel.appendChild(opt);
		}

		if (selectedCommand) sel.value = selectedCommand;
	}

	// ── Status message ────────────────────────────────────────────────────

	function setStatus(msg, isOk = false) {
		const el = document.getElementById("status");
		el.textContent = msg;
		el.className = isOk ? "ok" : "";
		if (isOk) setTimeout(() => { el.textContent = ""; el.className = ""; }, 3000);
	}

	// ── Event listeners ───────────────────────────────────────────────────

	document.getElementById("host").addEventListener("change", saveGlobal);
	document.getElementById("port").addEventListener("change", saveGlobal);
	document.getElementById("apiKey").addEventListener("change", saveGlobal);
	document.getElementById("command").addEventListener("change", saveCommand);

	document.getElementById("refreshBtn").addEventListener("click", () => {
		setStatus("Fetching commands…");
		document.getElementById("refreshBtn").disabled = true;
		// All three connection fields are embedded in the payload so the plugin
		// never needs to call getGlobalSettings() during a refresh (avoids a race
		// where the SDK's once-listener is consumed by a concurrent setGlobalSettings echo).
		const host = document.getElementById("host").value.trim() || "localhost";
		const port = parseInt(document.getElementById("port").value, 10) || 3000;
		const apiKey = document.getElementById("apiKey").value.trim();
		// Persist any unsaved changes before triggering the fetch.
		globals = { host, port, apiKey };
		ws.send(JSON.stringify({ event: "setGlobalSettings", context, payload: globals }));
		sendToPlugin({ event: "refreshCommands", host, port, apiKey });
	});
</script>

</body>
</html>
