<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Play SFX</title>
	<link rel="stylesheet" href="pi-common.css" />
</head>
<body>

<div class="row">
	<label for="serverUrl">Server URL</label>
	<input type="text" id="serverUrl" placeholder="https://bot.example.com" autocomplete="off" spellcheck="false" />
</div>
<div id="urlWarning"></div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="filter">Search</label>
	<input type="search" id="filter" placeholder="Filter by command or category" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="command">Command</label>
	<select id="command">
		<option value="">— select a command —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Commands</button>
</div>
<div id="status"></div>

<script src="pi-common.js"></script>
<script>
	/* global groupByField, matchesFilter, selectSaved, setButtonSettings, setStatus, setupCatalogPage */
	// Per-button settings: just the command. The trigger list comes from the plugin.
	const commandSelect = document.getElementById("command");
	const filterInput = document.getElementById("filter");
	let command = "";
	// What the last render showed, for the filter's status line and its single-match pick.
	let shown = { matches: [], total: 0 };

	const page = setupCatalogPage({
		selectId: "command",
		placeholder: "— select a command —",
		loadedEvent: "commandsLoaded",
		errorEvent: "commandsError",
		listKey: "triggers",
		refreshEvent: "refreshCommands",
		noun: "commands",
		render: renderTriggers,
		onLoaded: () => selectSaved(commandSelect, command, command, true),
	});

	/**
	 * Shows the button's saved command (pi-common.js calls this when its settings arrive).
	 * @param {object} s The button's settings.
	 */
	function onButtonSettings(s) {
		command = s.command || "";
		// If the list already arrived, apply the saved selection now.
		selectSaved(commandSelect, command, command, page.isLoaded());
	}

	/**
	 * Lists the sound effect commands that match the search box, grouped by category. The button's
	 * saved command is always listed, so a filter never hides what the key is set to.
	 * @param {HTMLSelectElement} sel The dropdown, emptied apart from its placeholder.
	 * @param {Array<{triggerCommand: string, categoryName?: string}>} triggers The commands from the plugin.
	 */
	function renderTriggers(sel, triggers) {
		const matches = triggers.filter((t) => matchesFilter(filterInput.value, t.triggerCommand, t.categoryName));
		shown = { matches, total: triggers.length };
		const listed = triggers.filter((t) => t.triggerCommand === command || matches.includes(t));
		for (const group of groupByField(listed, "categoryName")) {
			const optgroup = document.createElement("optgroup");
			optgroup.label = group.label || "Other";
			for (const t of group.items) {
				const opt = document.createElement("option");
				opt.value = t.triggerCommand;
				opt.textContent = t.triggerCommand;
				optgroup.appendChild(opt);
			}
			sel.appendChild(optgroup);
		}
	}

	/** Saves the dropdown's command as the button's. */
	function saveCommand() {
		command = commandSelect.value;
		setButtonSettings({ command });
	}

	/**
	 * Re-renders the list for the search box's text, says how many commands match, and picks the
	 * command when only one does, so typing part of its name is enough.
	 */
	function applyFilter() {
		if (!page.isLoaded()) return;
		page.redraw();
		if (!filterInput.value.trim()) {
			setStatus("");
			return;
		}
		const { matches, total } = shown;
		const only = matches.length === 1 ? matches[0] : undefined;
		if (only && only.triggerCommand !== command) {
			commandSelect.value = only.triggerCommand;
			saveCommand();
		}
		if (matches.length === 0) setStatus("No commands match.");
		else setStatus(`${matches.length} of ${total} commands match.`, true);
	}

	filterInput.addEventListener("input", applyFilter);
	commandSelect.addEventListener("change", saveCommand);
</script>

</body>
</html>
