<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Play SFX</title>
	<link rel="stylesheet" href="pi-common.css" />
</head>
<body>

<div class="row">
	<label for="serverUrl">Server URL</label>
	<input type="text" id="serverUrl" placeholder="https://bot.example.com" autocomplete="off" spellcheck="false" />
</div>
<div id="urlWarning"></div>
<div class="row">
	<label for="apiKey">API Key</label>
	<input type="password" id="apiKey" placeholder="64-char hex key" autocomplete="off" spellcheck="false" />
</div>
<div class="row">
	<label for="command">Command</label>
	<select id="command">
		<option value="">— select a command —</option>
	</select>
</div>
<div class="row">
	<label></label>
	<button id="refreshBtn">Refresh Commands</button>
</div>
<div id="status"></div>

<script src="pi-common.js"></script>
<script>
	// Per-button settings: just the command. The trigger list comes from the plugin.
	let command = "";

	function onButtonSettings(s) {
		command = s.command || "";
		// If commandsLoaded already populated the dropdown, apply the saved selection now.
		if (command) document.getElementById("command").value = command;
	}

	function onPluginMessage(payload) {
		if (payload.event === "commandsLoaded") {
			populateDropdown(payload.triggers || []);
			setStatus("Commands loaded.", true);
		} else if (payload.event === "commandsError") {
			setStatus(`Error: ${payload.error}`);
		}
		document.getElementById("refreshBtn").disabled = false;
	}

	function populateDropdown(triggers) {
		const sel = document.getElementById("command");
		sel.innerHTML = '<option value="">— select a command —</option>';
		for (const t of triggers) {
			const opt = document.createElement("option");
			opt.value = t.triggerCommand;
			opt.textContent = t.categoryName ? `[${t.categoryName}] ${t.triggerCommand}` : t.triggerCommand;
			sel.appendChild(opt);
		}
		if (command) sel.value = command;
	}

	document.getElementById("command").addEventListener("change", () => {
		command = document.getElementById("command").value;
		setButtonSettings({ command });
	});

	document.getElementById("refreshBtn").addEventListener("click", () => {
		setStatus("Fetching commands…");
		document.getElementById("refreshBtn").disabled = true;
		// Save first, and pass the fields along, so the plugin uses exactly what's in the form.
		const { serverUrl, apiKey } = saveGlobal();
		sendToPlugin({ event: "refreshCommands", serverUrl, apiKey });
	});
</script>

</body>
</html>
