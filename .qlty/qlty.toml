config_version = "0"

[[source]]
name = "default"
default = true

# Qlty runs ESLint in its own sandbox. Without the project's dependencies, type-aware rules can't
# resolve `@elgato/utils`, so JsonValue/JsonObject become 'error' types and
# no-redundant-type-constituents fires on every `JsonValue | undefined`.
# package_file makes Qlty install them from package.json before linting.
[[plugin]]
name = "eslint"
package_file = "package.json"

# A qlty.toml replaces Qlty's auto-detected plugin set, so each plugin that should keep running
# has to be listed. zizmor reports unpinned workflow actions (zizmor/unpinned-uses).
[[plugin]]
name = "zizmor"
